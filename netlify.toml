[build]
  publish = "."
  functions = "netlify/functions"

# These three aren't secrets (the code ships them as defaults), so don't let secret scanning fail the build.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,REMINDER_TZ"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
