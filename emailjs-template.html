<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f1ec;-webkit-font-smoothing:antialiased">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f1ec">
    <tr>
      <td align="center" style="padding:40px 16px">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:460px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">

          <!-- Wordmark -->
          <tr>
            <td align="center" style="padding:0 0 18px;font:italic 400 20px/1 Georgia,'Times New Roman',serif;color:#b4533a">Wishly</td>
          </tr>

          <!-- Card -->
          <tr>
            <td align="center" style="background:#ffffff;border:1px solid #ebe5dc;border-radius:20px;padding:36px 30px 34px">

              <!-- Date tile -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #ebe5dc;border-radius:14px;border-collapse:separate;overflow:hidden">
                <tr>
                  <td align="center" width="76" style="width:76px;background:#b4533a;color:#ffffff;font-size:11px;font-weight:700;letter-spacing:.16em;padding:7px 0;border-radius:13px 13px 0 0">{{month}}</td>
                </tr>
                <tr>
                  <td align="center" style="font:400 34px/1 Georgia,'Times New Roman',serif;color:#1f1a17;padding:12px 0 4px">{{day}}</td>
                </tr>
                <tr>
                  <td align="center" style="font-size:11px;color:#8a8079;padding:0 0 11px;letter-spacing:.04em">{{weekday}}</td>
                </tr>
              </table>

              <!-- When -->
              <div style="margin:22px 0 0;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#b4533a">{{when}}</div>

              <!-- Title -->
              <div style="margin:8px 0 0;font:400 28px/1.25 Georgia,'Times New Roman',serif;color:#1f1a17">{{title}}</div>

              <!-- Tagline -->
              <div style="margin:10px 0 0;font-size:15px;line-height:1.6;color:#6f665e">{{{tagline_html}}}</div>

              <!-- Notes (only present when the date has notes) -->
              {{{notes_html}}}

              <!-- Button -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px auto 0">
                <tr>
                  <td align="center" style="border-radius:999px;background:#1f1a17">
                    <a href="{{gcal_url}}" target="_blank" style="display:inline-block;padding:13px 26px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:999px">Add to Google Calendar</a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:20px 0 0;font-size:12px;line-height:1.6;color:#a39a91">
              You added this date on <a href="{{app_url}}" target="_blank" style="color:#a39a91">Wishly</a>.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
